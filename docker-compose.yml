services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - wafer_data:/data
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/waferinspect.db}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      - POSTGRES_USER=waferinspect
      - POSTGRES_PASSWORD=waferinspect
      - POSTGRES_DB=waferinspect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waferinspect -d waferinspect"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  wafer_data:
  postgres_data:
